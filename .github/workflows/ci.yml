name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ReviewPortal.slnx

      - name: Build
        run: dotnet build ReviewPortal.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ReviewPortal.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"
