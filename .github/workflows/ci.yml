name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Back End
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore BackEnd/ReviewPortal.slnx

      - name: Build
        run: dotnet build BackEnd/ReviewPortal.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BackEnd/tests/ReviewPortal.UnitTests/ReviewPortal.UnitTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage"

  frontend:
    name: Front End
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
